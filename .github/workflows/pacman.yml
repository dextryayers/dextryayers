name: Generate Pacman Game Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Jalankan setiap hari
  workflow_dispatch:     # Jalankan manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install pacman-contribution-graph

      - name: Generate Pacman SVG
        run: |
          npx -y pacman-contribution-graph \
            --username dextryayers \
            --platform github \
            --theme github-dark \
            --output dist/pacman.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: false
