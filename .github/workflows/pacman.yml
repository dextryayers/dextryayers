name: Generate Pac-Man Game

on:
  schedule:
    # Jalankan setiap hari pada tengah malam UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Untuk menjalankan secara manual

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Opsional: tentukan game dan tema, defaultnya adalah 'pacman' dan 'github-dark'
          # game: 'pacman'
          # game_theme: 'github-dark'

      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
